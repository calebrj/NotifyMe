apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - notifyme.130.107.161.10.nip.io
    secretName: notifyme-tls
  rules:
  - host: notifyme.130.107.161.10.nip.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: node-gateway-service
            port:
              number: 8000
