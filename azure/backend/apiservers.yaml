# --- Node.js Gateway (port 8000, LoadBalancer exposed) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-gateway
  template:
    metadata:
      labels:
        app: node-gateway
    spec:
      containers:
      - name: node-gateway
        image: capstonenotifyme.azurecr.io/server_fastapi-image:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: node-env-secret
---
apiVersion: v1
kind: Service
metadata:
  name: node-gateway-service
spec:
  selector:
    app: node-gateway
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
