# --- FastAPI Model Forest (port 8001) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-model-forest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-model-forest
  template:
    metadata:
      labels:
        app: fastapi-model-forest
    spec:
      containers:
      - name: fastapi-model
        image: capstonenotifyme.azurecr.io/model_forest_fastapi-image:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-model-forest-service
spec:
  selector:
    app: fastapi-model-forest
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP

# --- FastAPI Route App (port 8002) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-route-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-route
  template:
    metadata:
      labels:
        app: fastapi-route
    spec:
      containers:
      - name: fastapi-route
        image: capstonenotifyme.azurecr.io/route_fastapi-image:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        envFrom:
        - secretRef:
            name: node-env-secret 
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-route-service
spec:
  selector:
    app: fastapi-route
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002
  type: ClusterIP

